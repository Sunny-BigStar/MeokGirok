<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>먹기록 로그인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login">
    <form id="f" class="card">
      <h2>먹기록</h2>
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required autofocus>
      <div id="err" class="err" hidden></div>
      <button class="primary">로그인</button>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
